<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 11</title>
</head>
<body>

    <h1>Exercício 11</h1>

    <label>Temperatura em Fahrenheit:</label>
    <input type="number" id="fahrenheit" step="0.01">

    <button onclick="converter()">Converter</button>

    <p id="resultado"></p>

    <script>
        function converter() {
            let fahrenheit =
                Number(document.getElementById("fahrenheit").value);

            let celsius = (fahrenheit - 32) * 5 / 9;

            console.log("Celsius:", celsius);

            document.getElementById("resultado").innerHTML =
                fahrenheit + " °F = " +
                celsius.toFixed(2) + " °C";
        }
    </script>

</body>
</html>
