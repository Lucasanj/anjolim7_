<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 16</title>
</head>
<body>

    <h1>Exercício 16 - Salários Mínimos</h1>

    <label>Valor do salário mínimo:</label>
    <input type="number" id="salarioMinimo" step="0.01">

    <br><br>

    <label>Salário da pessoa:</label>
    <input type="number" id="salarioPessoa" step="0.01">

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let salarioMinimo =
                Number(document.getElementById("salarioMinimo").value);

            let salarioPessoa =
                Number(document.getElementById("salarioPessoa").value);

            let quantidade =
                salarioPessoa / salarioMinimo;

            console.log("Quantidade de salários mínimos:", quantidade);

            document.getElementById("resultado").innerHTML =
                "A pessoa ganha " +
                quantidade.toFixed(2) +
                " salário(s) mínimo(s).";
        }
    </script>

</body>
</html>
