<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 7</title>
</head>
<body>

    <h1>Exercício 7</h1>

    <label>Valor da aplicação:</label>
    <input type="number" id="valor" step="0.01">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let valor = Number(document.getElementById("valor").value);

            let novoValor = valor + (valor * 8 / 100);

            console.log("Valor informado:", valor);
            console.log("Novo valor:", novoValor);

            document.getElementById("resultado").innerHTML =
                "Valor informado: R$ " + valor.toFixed(2) + "<br>" +
                "Valor acrescido de 8%: R$ " + novoValor.toFixed(2);
        }
    </script>

</body>
</html>
