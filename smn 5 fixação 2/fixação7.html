<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<body>

    <h1>Exercício 7 - Segundos desde o início do dia</h1>

    <label>Hora:</label>
    <input type="number" id="hora" min="0" max="23">
    <br><br>

    <label>Minutos:</label>
    <input type="number" id="minutos" min="0" max="59">
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let hora = Number(document.getElementById("hora").value);
            let minutos = Number(document.getElementById("minutos").value);

            let segundos = (hora * 3600) + (minutos * 60);

            console.log("Segundos desde o início do dia:", segundos);

            document.getElementById("resultado").textContent =
                "Já se passaram " + segundos +
                " segundos desde o início do dia.";
        }
    </script>

</body>
</html>
