<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>

    <h1>Exercício 6 - Loja de Bicicletas</h1>

    <label>Número de empregados:</label>
    <input type="number" id="empregados">
    <br><br>

    <label>Valor do salário mínimo:</label>
    <input type="number" id="salarioMinimo" step="0.01">
    <br><br>

    <label>Preço de custo de cada bicicleta:</label>
    <input type="number" id="precoCusto" step="0.01">
    <br><br>

    <label>Número de bicicletas vendidas:</label>
    <input type="number" id="bicicletas">
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let empregados =
                Number(document.getElementById("empregados").value);

            let salarioMinimo =
                Number(document.getElementById("salarioMinimo").value);

            let precoCusto =
                Number(document.getElementById("precoCusto").value);

            let bicicletas =
                Number(document.getElementById("bicicletas").value);

            // Preço de venda = custo + 50%
            let precoVenda = precoCusto + (precoCusto * 50 / 100);

            // Faturamento total
            let faturamento = precoVenda * bicicletas;

            // Custo total das bicicletas
            let custoBicicletas = precoCusto * bicicletas;

            // Comissão total: 15% do preço de custo
            let comissaoTotal = custoBicicletas * 15 / 100;

            // Comissão de cada empregado
            let comissaoPorEmpregado = comissaoTotal / empregados;

            // Salário de cada empregado
            let salarioBase = salarioMinimo * 2;

            let salarioFinal =
                salarioBase + comissaoPorEmpregado;

            // Total pago aos empregados
            let salariosTotais = salarioBase * empregados;

            // Lucro líquido
            let lucro =
                faturamento -
                custoBicicletas -
                comissaoTotal -
                salariosTotais;

            console.log("Preço de venda:", precoVenda);
            console.log("Salário final de cada empregado:", salarioFinal);
            console.log("Lucro líquido:", lucro);

            document.getElementById("resultado").innerHTML =
                "Preço de venda de cada bicicleta: R$ " +
                precoVenda.toFixed(2) + "<br><br>" +

                "Salário final de cada empregado: R$ " +
                salarioFinal.toFixed(2) + "<br><br>" +

                "<strong>Lucro líquido da loja: R$ " +
                lucro.toFixed(2) + "</strong>";
        }
    </script>

</body>
</html>
