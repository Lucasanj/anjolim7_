<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>

    <h1>Exercício 5 - Peso</h1>

    <label>Digite o peso em Kg:</label>
    <input type="number" id="peso" step="0.01">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let peso = Number(document.getElementById("peso").value);

            // Convertendo Kg para gramas
            let pesoGramas = peso * 1000;

            // Aumento de 12%
            let novoPeso = pesoGramas + (pesoGramas * 12 / 100);

            console.log("Peso em gramas:", pesoGramas);
            console.log("Novo peso:", novoPeso);

            document.getElementById("resultado").innerHTML =
                "a) Peso em gramas: " +
                pesoGramas.toFixed(2) + " g<br><br>" +

                "b) Novo peso com aumento de 12%: " +
                novoPeso.toFixed(2) + " g";
        }
    </script>

</body>
</html>
