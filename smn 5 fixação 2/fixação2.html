<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>

    <h1>Exercício 2 - Conversão de Dólar</h1>

    <label>Quantidade de dólares:</label>
    <input type="number" id="dolares" step="0.01">
    <br><br>

    <label>Cotação do dólar:</label>
    <input type="number" id="cotacao" step="0.01">
    <br><br>

    <button onclick="converter()">Converter</button>

    <p id="resultado"></p>

    <script>
        function converter() {
            let dolares = Number(document.getElementById("dolares").value);
            let cotacao = Number(document.getElementById("cotacao").value);

            let reais = dolares * cotacao;

            console.log("Dólares:", dolares);
            console.log("Cotação:", cotacao);
            console.log("Valor em reais:", reais);

            document.getElementById("resultado").innerHTML =
                "Dólares: US$ " + dolares.toFixed(2) + "<br>" +
                "Cotação: R$ " + cotacao.toFixed(2) + "<br>" +
                "<strong>Valor em reais: R$ " + reais.toFixed(2) + "</strong>";
        }
    </script>

</body>
</html>
