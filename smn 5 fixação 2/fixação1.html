<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>

    <h1>Exercício 1 - Custo Final do Carro</h1>

    <label>Custo de fábrica:</label>
    <input type="number" id="custo" step="0.01">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let custo = Number(document.getElementById("custo").value);

            let distribuidor = custo * 28 / 100;
            let impostos = custo * 45 / 100;

            let custoFinal = custo + distribuidor + impostos;

            console.log("Custo de fábrica:", custo);
            console.log("Percentual do distribuidor:", distribuidor);
            console.log("Impostos:", impostos);
            console.log("Custo final:", custoFinal);

            document.getElementById("resultado").innerHTML =
                "Custo de fábrica: R$ " + custo.toFixed(2) + "<br>" +
                "Distribuidor (28%): R$ " + distribuidor.toFixed(2) + "<br>" +
                "Impostos (45%): R$ " + impostos.toFixed(2) + "<br>" +
                "<strong>Custo final: R$ " + custoFinal.toFixed(2) + "</strong>";
        }
    </script>

</body>
</html>
