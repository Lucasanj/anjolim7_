<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - Círculo</title>
</head>
<body>

<script>
    function AreaCirculo(raio) {
        let area = Math.PI * raio * raio;
        return area;
    }

    function CompCircunferencia(raio) {
        let comprimento = 2 * Math.PI * raio;
        return comprimento;
    }

    let raio = Number(prompt("Digite o raio do círculo:"));

    let area = AreaCirculo(raio);
    let perimetro = CompCircunferencia(raio);

    console.log("Área do círculo: " + area.toFixed(2));
    console.log("Perímetro do círculo: " + perimetro.toFixed(2));
</script>

</body>
</html>
