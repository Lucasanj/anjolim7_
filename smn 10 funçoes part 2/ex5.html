<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercício 5 - Vogais e Consoantes</title>
</head>
<body>

<script>
    function ContaVogais(palavra) {

        let quantidade = 0;
        let vogais = "aeiouAEIOU";

        for (let i = 0; i < palavra.length; i++) {

            if (vogais.includes(palavra[i])) {
                quantidade++;
            }
        }

        return quantidade;
    }


    function ContaConsoantes(palavra) {

        let quantidade = 0;
        let vogais = "aeiouAEIOU";

        for (let i = 0; i < palavra.length; i++) {

            let caractere = palavra[i];

            if (
                /[a-zA-Z]/.test(caractere) &&
                !vogais.includes(caractere)
            ) {
                quantidade++;
            }
        }

        return quantidade;
    }


    let palavra = prompt("Digite uma palavra:");

    console.log("Palavra: " + palavra);
    console.log("Quantidade de vogais: " + ContaVogais(palavra));
    console.log("Quantidade de consoantes: " + ContaConsoantes(palavra));
</script>

</body>
</html>
