<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>

    <h1>Exercício 10</h1>

    <label>Salário mensal:</label>
    <input type="number" id="salario" step="0.01">
    <br><br>

    <label>Percentual de reajuste (%):</label>
    <input type="number" id="percentual" step="0.01">
    <br><br>

    <button onclick="calcular()">Calcular novo salário</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let salario = Number(document.getElementById("salario").value);
            let percentual = Number(document.getElementById("percentual").value);

            let novoSalario = salario + (salario * percentual / 100);

            console.log("Novo salário:", novoSalario);

            document.getElementById("resultado").textContent =
                "Novo salário: R$ " + novoSalario.toFixed(2);
        }
    </script>

</body>
</html>
