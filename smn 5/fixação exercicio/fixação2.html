<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>

    <h1>Exercício 2</h1>
    <p>Média aritmética dos números 8, 9 e 7:</p>

    <p id="resultado"></p>

    <script>
        let media = (8 + 9 + 7) / 3;

        console.log("A média é:", media);
        document.getElementById("resultado").textContent =
            "Média: " + media;
    </script>

</body>
</html>
