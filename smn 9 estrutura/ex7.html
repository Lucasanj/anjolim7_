<!DOCTYPE html>
<html>
<head>
    <title>Exercício 7</title>
</head>
<body>

<script>
    let A = [];
    let B = [];
    let SOMA = [];

    // Preenchendo A
    for (let i = 0; i < 5; i++) {
        A[i] = Number(prompt("Digite A[" + i + "]:"));
    }

    // Preenchendo B
    for (let i = 0; i < 5; i++) {
        B[i] = Number(prompt("Digite B[" + i + "]:"));
    }

    // Calculando SOMA
    for (let i = 0; i < 5; i++) {
        SOMA[i] = A[i] + B[i];
    }

    console.log("Vetor A:", A);
    console.log("Vetor B:", B);
    console.log("Vetor SOMA:", SOMA);
</script>

</body>
</html>
