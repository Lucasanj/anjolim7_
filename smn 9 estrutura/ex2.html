<!DOCTYPE html>
<html>
<head>
    <title>Exercício 2</title>
</head>
<body>

<script>
    let D = [];
    let F = [];

    // Preenchendo o vetor D
    for (let i = 0; i < 10; i++) {
        D[i] = Number(prompt("Digite o valor D[" + i + "]:"));
    }

    // Copiando D para F
    for (let i = 0; i < 10; i++) {
        F[i] = D[i];
    }

    console.log("Vetor F:");

    for (let i = 0; i < 10; i++) {
        console.log("F[" + i + "] = " + F[i]);
    }
</script>

</body>
</html>
