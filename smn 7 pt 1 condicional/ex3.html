<!DOCTYPE html>

</head>
<body>

<script>
    let numero = Number(prompt("Digite um número:"));

    if (numero % 5 === 0) {
        console.log("O número é divisível por 5.");
    } else {
        console.log("O número não é divisível por 5.");
    }
</script>

</body>
