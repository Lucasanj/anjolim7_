<!DOCTYPE html>
<html>
<head>
    <title>Exercício 5</title>
</head>
<body>

<script>
    let numero = Number(prompt("Digite um número:"));

    if (numero > 20) {
        console.log("Número maior que 20");
    } else if (numero === 20) {
        console.log("Número igual a 20");
    } else {
        console.log("Número menor que 20");
    }
</script>

</body>
</html>
