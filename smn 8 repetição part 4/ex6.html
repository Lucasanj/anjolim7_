            font-family: monospace;

<body>

<script>
    let N = Number(prompt("Digite o tamanho do triângulo:"));

    for (let linha = 1; linha <= N; linha++) {

        let texto = "";

        for (let numero = 1; numero <= linha; numero++) {
            texto += numero + " ";
        }

        console.log(texto);
    }
</script>
