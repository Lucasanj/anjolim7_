<!DOCTYPE html>
<html>
<head>
    <title>Exercício 3</title>
</head>
<body>

<script>
    let codigo;

    do {

        codigo = Number(prompt(
            "Digite o código do combustível:\n" +
            "1 - Álcool\n" +
            "2 - Gasolina\n" +
            "3 - Diesel\n" +
            "4 - Fim"
        ));

        if (codigo < 1 || codigo > 4 || isNaN(codigo)) {
            console.log("Código inválido!");
        }

    } while (codigo !== 4);

    console.log("Programa encerrado.");
</script>

</body>
</html>
