<!DOCTYPE html>

    <title>Exercício 5</title>

    <style>
        body {
            font-family: monospace;
        }
    </style>
</head>
<body>

<script>
    let N = Number(prompt("Digite o tamanho do quadrado:"));

    for (let linha = 1; linha <= N; linha++) {

        let texto = "";

        for (let coluna = 1; coluna <= N; coluna++) {
            texto += "* ";
        }

        console.log(texto);
    }
</script>

</body>
