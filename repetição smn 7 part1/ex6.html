<!DOCTYPE html>

    <title>Exercício 6</title>
</head>
<body>

<script>
    for (let i = 1; i <= 10; i++) {
        let numero = Number(prompt("Digite o " + i + "º número:"));

        if (numero % 2 === 0) {
            console.log(numero + " é PAR.");
        } else {
            console.log(numero + " é ÍMPAR.");
        }
    }
</script>

</body>
