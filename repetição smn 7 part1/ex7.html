<!DOCTYPE html>
<html>
<head>
    <title>Exercício 7</title>
</head>
<body>

<script>
    let n1 = Number(prompt("Digite o primeiro número:"));
    let n2 = Number(prompt("Digite o segundo número:"));

    if (n1 <= n2) {

        for (let i = n1; i <= n2; i++) {
            console.log(i);
        }

    } else {

        for (let i = n1; i >= n2; i--) {
            console.log(i);
        }

    }
</script>

</body>
</html>
