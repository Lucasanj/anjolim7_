<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<ul>
		<li>Notebook</li>
		<li>Teclado</li>
		<li>Mouse</li>
		<li>Monitor</li>
		<li>Webcam</li>
	</ul>
	<script>
		var ul = document.querySelector("ul");
		for (var i = 0; i < ul.children.length; i++) {
			if(ul.children[i].textContent === "Mouse") {
				ul.children[i].remove();
			}
			if(ul.children[i].textContent === "Webcam") {
				ul.children[i].remove();
			}
		}
	</script>
</body>
</html>
