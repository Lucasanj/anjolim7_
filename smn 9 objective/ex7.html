<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		a {
			display: block;
			margin-top: 20px;
		}
		img{
			border-radius: 10px;
		}
	</style>
</head>
<body>

	<script>

		h1.id = "titulo";
	</script>
</body>
</html>
