<script>
    let graosNaCasa = 1;
    let totalGraos = 0;

    for (let casa = 1; casa <= 64; casa++) {

        totalGraos += graosNaCasa;

        graosNaCasa *= 2;
    }

    console.log("Total de grãos: " + totalGraos);
</script>
