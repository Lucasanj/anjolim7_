<!DOCTYPE html>

<body>

<script>
    let chico = 150;
    let juca = 110;
    let anos = 0;

    while (juca <= chico) {
        chico += 2;
        juca += 3;
        anos++;
    }

    console.log("Serão necessários " + anos + " anos.");
    console.log("Altura de Chico: " + chico + " cm");
    console.log("Altura de Juca: " + juca + " cm");
</script>

</body>
