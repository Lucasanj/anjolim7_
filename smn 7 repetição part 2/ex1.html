<!DOCTYPE html>
<html>
<head>
    <title>Exercício 1</title>
</head>
<body>

<script>
    let numero = Number(prompt("Digite um número (0 para encerrar):"));

    while (numero !== 0) {

        if (numero > 0) {
            console.log("POSITIVO");
        } else {
            console.log("NEGATIVO");
        }

        numero = Number(prompt("Digite outro número (0 para encerrar):"));
    }
</script>

</body>
</html>
