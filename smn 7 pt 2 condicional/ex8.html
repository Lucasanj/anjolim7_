<!DOCTYPE html>
<html>
<head>
    <title>Exercício 8</title>
</head>
<body>

<script>
    let lado1 = Number(prompt("Digite o primeiro lado:"));
    let lado2 = Number(prompt("Digite o segundo lado:"));
    let lado3 = Number(prompt("Digite o terceiro lado:"));

    let maior;
    let cateto1;
    let cateto2;

    // Descobre qual é o maior lado
    if (lado1 >= lado2 && lado1 >= lado3) {
        maior = lado1;
        cateto1 = lado2;
        cateto2 = lado3;
    } else if (lado2 >= lado1 && lado2 >= lado3) {
        maior = lado2;
        cateto1 = lado1;
        cateto2 = lado3;
    } else {
        maior = lado3;
        cateto1 = lado1;
        cateto2 = lado2;
    }

    // Verifica se pode formar um triângulo
    let formaTriangulo =
        lado1 > 0 &&
        lado2 > 0 &&
        lado3 > 0 &&
        cateto1 + cateto2 > maior;

    if (formaTriangulo && (cateto1 ** 2 + cateto2 ** 2 === maior ** 2)) {
        console.log("É UM TRIÂNGULO RETÂNGULO");
    } else {
        console.log("NÃO É UM TRIÂNGULO RETÂNGULO");
    }
</script>

</body>
</html>
