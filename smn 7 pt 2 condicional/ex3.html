<!DOCTYPE html>

    <title>Exercício 3</title>
</head>
<body>

<script>
    let A = Number(prompt("Digite o valor de A:"));
    let B = Number(prompt("Digite o valor de B:"));

    if (A % B === 0 || B % A === 0) {
        console.log("São Múltiplos");
    } else {
        console.log("Não são Múltiplos");
    }
</script>

</body>
