<!DOCTYPE html>
<html>
<head>
    <title>Exercício 10</title>
</head>
<body>

<script>
    let x = Number(prompt("Digite o valor de X:"));
    let y = Number(prompt("Digite o valor de Y:"));

    if (x === 0 && y === 0) {
        console.log("Origem");

    } else if (y === 0) {
        console.log("Eixo X");

    } else if (x === 0) {
        console.log("Eixo Y");

    } else if (x > 0 && y > 0) {
        console.log("Quadrante 1");

    } else if (x < 0 && y > 0) {
        console.log("Quadrante 2");

    } else if (x < 0 && y < 0) {
        console.log("Quadrante 3");

    } else {
        console.log("Quadrante 4");
    }
</script>

</body>
</html>
