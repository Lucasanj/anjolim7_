<!DOCTYPE html>
<html>
<head>
    <title>Exercício 4</title>
</head>
<body>

<script>
    let valorHora = Number(prompt("Digite o valor da hora normal:"));
    let horasTrabalhadas = Number(prompt("Digite a quantidade de horas trabalhadas:"));

    let salarioNormal;
    let salarioExtra = 0;
    let salarioTotal;

    if (horasTrabalhadas <= 40) {
        salarioNormal = horasTrabalhadas * valorHora;
    } else {
        salarioNormal = 40 * valorHora;

        let horasExtras = horasTrabalhadas - 40;
        let valorHoraExtra = valorHora * 1.5;

        salarioExtra = horasExtras * valorHoraExtra;
    }

    salarioTotal = salarioNormal + salarioExtra;

    console.log("Salário normal: R$ " + salarioNormal.toFixed(2));
    console.log("Salário extra: R$ " + salarioExtra.toFixed(2));
    console.log("Salário total: R$ " + salarioTotal.toFixed(2));
</script>

</body>
</html>
