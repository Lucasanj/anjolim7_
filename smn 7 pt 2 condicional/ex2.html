<!DOCTYPE html>
<html>
<head>
    <title>Exercício 2</title>
</head>
<body>

<script>
    let idade = Number(prompt("Digite a idade:"));

    if (idade < 16) {
        console.log("Não-eleitor");
    } else if (idade < 18) {
        console.log("Eleitor facultativo");
    } else if (idade <= 65) {
        console.log("Eleitor obrigatório");
    } else {
        console.log("Eleitor facultativo");
    }
</script>

</body>
</html>
