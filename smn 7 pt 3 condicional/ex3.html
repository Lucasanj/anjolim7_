<!DOCTYPE html>
<html>
<head>
    <title>Exercício 3</title>
</head>
<body>

<script>
    let ddd = Number(prompt("Digite o código DDD:"));

    if (ddd === 11) {
        console.log("São Paulo");

    } else if (ddd === 21) {
        console.log("Rio de Janeiro");

    } else if (ddd === 31) {
        console.log("Belo Horizonte");

    } else if (ddd === 41) {
        console.log("Curitiba");

    } else if (ddd === 48) {
        console.log("Florianópolis");

    } else if (ddd === 51) {
        console.log("Porto Alegre");

    } else if (ddd === 61) {
        console.log("Brasília");

    } else {
        console.log("DDD não cadastrado");
    }
</script>

</body>
</html>
