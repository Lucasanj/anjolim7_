<!DOCTYPE html>
<html>
<head>
    <title>Exercício 5</title>
</head>
<body>

<script>
    let pesoKg = Number(prompt("Digite o peso da pessoa em kg:"));

    // a) Peso em gramas
    let pesoGramas = pesoKg * 1000;

    // b) Novo peso após engordar 12%
    let novoPesoGramas = pesoGramas * 1.12;

    console.log("a) Peso em gramas: " + pesoGramas + " g");
    console.log("b) Novo peso em gramas: " + novoPesoGramas.toFixed(2) + " g");
</script>

</body>
</html>
