<script>
    let hora = Number(prompt("Digite a hora:"));
    let minutos = Number(prompt("Digite os minutos:"));

    let segundos = (hora * 3600) + (minutos * 60);

    console.log("Segundos desde o início do dia: " + segundos);
</script>
