<!DOCTYPE html>
<html>
<head>
    <title>Exercício 9</title>
</head>
<body>

<script>
    let valorMercadoria = Number(prompt("Digite o valor da mercadoria:"));
    let porcentagemDesconto = Number(prompt("Digite a porcentagem de desconto:"));

    let desconto = valorMercadoria * (porcentagemDesconto / 100);
    let novoValor = valorMercadoria - desconto;

    console.log("Valor do desconto: R$ " + desconto.toFixed(2));
    console.log("Novo valor da mercadoria: R$ " + novoValor.toFixed(2));
</script>

</body>
</html>
