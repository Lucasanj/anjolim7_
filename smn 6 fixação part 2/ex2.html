<!DOCTYPE html>
<html>
<head>
    <title>Exercício 2</title>
</head>
<body>

<script>
    let quantidadeDolares = Number(prompt("Digite a quantidade de dólares:"));
    let cotacao = Number(prompt("Digite a cotação do dólar:"));

    let valorReais = quantidadeDolares * cotacao;

    console.log("Valor em reais: R$ " + valorReais.toFixed(2));
</script>

</body>
</html>
