<!DOCTYPE html>
<html>
<head>
    <title>Exercício 3</title>
</head>
<body>

<script>
    let A = Number(prompt("Digite o valor de A:"));
    let B = Number(prompt("Digite o valor de B:"));

    let soma = 0;

    for (let i = A; i <= B; i++) {
        soma = soma + i;
    }

    console.log("Soma dos valores entre A e B: " + soma);
</script>

</body>
</html>
